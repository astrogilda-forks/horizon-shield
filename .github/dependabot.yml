# Dependabot keeps the GitHub Actions in .github/workflows current. Every action here is pinned by full commit SHA
# with a "# vX.Y.Z" comment; Dependabot updates both the SHA and the comment in one pull request.
# Not covered on purpose: the npm package nenrin-verify (workers/hs-ledger/nenrin/sdk) has no dependencies, the
# PyPI package declares only cryptography>=41 with no pinned or locked versions, and the Go module uses the
# standard library only.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
  # agent-evidence-vectors, the corpus the RFC 8785 conduct-walk check runs, is pinned in requirements/agent-evidence-vectors.txt
  # so a new release arrives as a pull request that CI tests, not as a stale number inside a workflow line.
  - package-ecosystem: pip
    directory: "/requirements"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci"
