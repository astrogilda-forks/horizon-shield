name: conduct-walk rfc8785 corpus

# a2a_conduct_walk.py の RFC 8785 正規化を、agent-evidence-vectors 0.20.0 が同梱する a2a-tck の正規化コーパス
# (vectors-a2a-jcs-v01 の rfc8785 の 53 件) に通す。版は固定する。2026-10-19 に小数を書くよう直した (#55)。

on:
  push:
    paths:
      - "workers/hs-ledger/nenrin/a2a-conduct-walk/a2a_conduct_walk.py"
      - "workers/hs-ledger/nenrin/a2a-conduct-walk/rfc8785_corpus_check.py"
      - ".github/workflows/conduct-walk-rfc8785.yml"
  pull_request:
    paths:
      - "workers/hs-ledger/nenrin/a2a-conduct-walk/a2a_conduct_walk.py"
      - "workers/hs-ledger/nenrin/a2a-conduct-walk/rfc8785_corpus_check.py"
      - ".github/workflows/conduct-walk-rfc8785.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install the pinned corpus
        run: python -m pip install --disable-pip-version-check agent-evidence-vectors==0.20.0
      - name: rfc8785 vectors
        run: python workers/hs-ledger/nenrin/a2a-conduct-walk/rfc8785_corpus_check.py
