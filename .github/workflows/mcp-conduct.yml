# Our own servers through the same door as everyone else. Report mode: a red row is a fact to publish, not a build to hide.
# 2026-09-05: repointed from the duplicate action (mcp-conduct-action, now archived) to the canonical one.
# Consent for the determinism probe is not asserted here. It is resolved by the gate from the operator list
# or from /.well-known/mcp-conduct.json on the origin, which is the only basis the scheduled sweep accepts.
name: MCP conduct (own servers)
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
jobs:
  conduct:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        endpoint:
          - https://mcp.horizonshield.dev/mcp
          - https://web.horizonshield.dev/mcp
          - https://hearing.horizonshield.dev/mcp
          - https://jidec.horizonshield.dev/mcp
          - https://gate.horizonshield.dev/mcp
          - https://femtech.horizonshield.dev/mcp
          - https://ccdb.horizonshield.dev/mcp
    steps:
      - uses: ogasurfproject-jpg/wedjat-check-action@v1
        id: conduct
        with:
          endpoint: ${{ matrix.endpoint }}
          require: none
      - name: Write the verdict out for keeping
        if: always()
        env:
          RECORD: ${{ steps.conduct.outputs.record }}
        run: printf '%s' "$RECORD" > verdict.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verdict-${{ strategy.job-index }}
          path: verdict.json
          retention-days: 30
