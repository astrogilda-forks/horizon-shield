name: public boundary

# 公開 repo に、非公開にすべき物(Shield、相互登録と募集の方針、秘密鍵)が入っていないかを push ごとに確かめる。
# 規則は tools/boundary/private_patterns.txt。
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tools/boundary/check_public_boundary.sh

  # The files that list the hs-mcp tools (lhm.plugin.json, CODEX.md, README.md, llms.txt and others) against the
  # canonical tool list in tools/listing_tools_sync.mjs. Fails red on a retired tool name used as current, a missing
  # tool, or a mirrored manifest that differs from its source.
  listing-sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "22"
      - run: node tools/listing_tools_sync.mjs --selftest
      - run: node tools/listing_tools_sync.mjs

  # issue #13: a KV/R2 read whose failure is swallowed into null, {}, [] or "" and then written back or answered as
  # "absent". ops/no_swallowed_read.mjs parses the deployed worker sources (wrangler main and its imports, plus
  # workers/*/src) with the acorn bundled in Node and fails red on any hit outside its allowlist. The test checks
  # bad snippets are flagged, the 2026-10-13 fixed patterns pass, and the current tree exits 0.
  swallowed-read:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "22"
      - run: node ops/no_swallowed_read.test.mjs
      - run: node ops/no_swallowed_read.mjs
