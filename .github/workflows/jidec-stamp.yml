name: JIDEC stamp
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: jidec-stamp
  cancel-in-progress: false
jobs:
  stamp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install OpenTimestamps client
        run: pip install opentimestamps-client
      - name: Stamp pending ledger entries
        env:
          LEDGER_URL: https://hs-ledger.oga-surf-project.workers.dev
          LEDGER_ADMIN_TOKEN: ${{ secrets.LEDGER_ADMIN_TOKEN }}
        run: python scripts/jidec_stamp.py
