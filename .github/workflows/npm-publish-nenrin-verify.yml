name: npm publish nenrin-verify (provenance)

# nenrin-verify を npm に、SLSA provenance 付きで出す。
# なぜ CI から出すか: 2026-09-20 に 0.2.0 を運営者のラップトップから出した。それやと「npm の verifier が
# 監査した GitHub の source と同じ物か」を tarball の hash でしか結べん。ここから出すと npm が
# GitHub OIDC で「この commit のこの workflow がこの tarball を作った」を署名して残す (provenance attestation)。
# 読む側は npm audit signatures か、npm view の attestations で確かめられる。
#
# 認証は npm の Trusted Publishing (GitHub OIDC)。長期 token は置かん。一度だけ npmjs.com で設定が要る:
#   package nenrin-verify -> Settings -> Trusted Publisher -> GitHub Actions
#   owner: ogasurfproject-jpg / repository: horizon-shield / workflow: npm-publish-nenrin-verify.yml / environment: (空)
# それまでは publish が E401/E404 で止まる。止まるだけで何も出ん。
#
# 使い方: Actions -> npm publish nenrin-verify (provenance) -> Run workflow -> version に出す版 (package.json と同じ物)。
# 版を上げるのはこの workflow の仕事やない。sdk/package.json を上げて commit して push してから、ここを叩く。
# そうすると attestation が指す commit が、その版の source そのものになる。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "出す版。workers/hs-ledger/nenrin/sdk/package.json の version と同じでないと止まる"
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: npm-publish-nenrin-verify
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/hs-ledger/nenrin/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: 24

      - name: Guard, the version named is the version in the tree and is not on npm yet
        env:
          WANT: ${{ github.event.inputs.version }}
        run: |
          HAVE=$(node -e 'console.log(require("./package.json").version)')
          echo "tree: $HAVE   asked: $WANT"
          if [ "$HAVE" != "$WANT" ]; then echo "refuse: package.json is $HAVE, you asked for $WANT. Bump and commit first."; exit 1; fi
          if npm view "nenrin-verify@$WANT" version >/dev/null 2>&1; then echo "refuse: nenrin-verify@$WANT is already on npm. Bump."; exit 1; fi
          echo "npm $(npm --version), node $(node --version)"

      - name: Prove the bundles are what this commit builds (byte identity, offline)
        run: |
          node nenrin_verify.test.mjs
          node tsugi_verify.test.mjs
          node agreement.test.mjs
          node build_tsunagi_corpora.mjs --check
          node tsunagi.test.mjs

      # CycloneDX SBOM of what is published, from npm itself (npm sbom, built into npm 10 and later).
      # The package has no dependencies, so the SBOM names the package alone; it is the record that says so.
      # Written outside the package directory so it can never end up in the tarball.
      - name: SBOM (CycloneDX, npm sbom)
        env:
          WANT: ${{ github.event.inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          OUT="$RUNNER_TEMP/sbom/nenrin-verify-$WANT.cdx.json"
          npm sbom --sbom-format cyclonedx --sbom-type library > "$OUT"
          # npm names the root component after the directory (sdk); purl and bom-ref already say nenrin-verify.
          node -e 'const fs=require("fs");const p=process.argv[1];const b=JSON.parse(fs.readFileSync(p,"utf8"));b.metadata.component.name=require("./package.json").name;fs.writeFileSync(p,JSON.stringify(b,null,2)+"\n")' "$OUT"
          node -e 'const b=require(process.argv[1]);const c=b.metadata.component;console.log(b.bomFormat,b.specVersion,c.name,c.version,c.purl,"components:",(b.components||[]).length)' "$OUT"
          sha256sum "$OUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-nenrin-verify-npm-${{ github.event.inputs.version }}
          path: ${{ runner.temp }}/sbom/nenrin-verify-${{ github.event.inputs.version }}.cdx.json
          if-no-files-found: error

      - name: Publish with provenance (Trusted Publishing, GitHub OIDC)
        run: npm publish --provenance --access public

      - name: Verify the attestation landed (waits for the registry, which needs a few minutes after publish)
        env:
          WANT: ${{ github.event.inputs.version }}
        run: |
          # 2026-10-13: 0.5.2 was published, but the registry's version list showed it only after more than
          # 3 minutes, so the old 36 x 5 s wait gave up and marked a good publish red. The version document
          # (registry.npmjs.org/<name>/<version>) appears earlier than the list; check it first, then the list,
          # for up to 10 minutes.
          seen=""
          for i in $(seq 1 60); do
            if curl -fsS -H "Cache-Control: no-cache" "https://registry.npmjs.org/nenrin-verify/$WANT" >/dev/null 2>&1 && npm view "nenrin-verify@$WANT" version >/dev/null 2>&1; then seen=1; break; fi
            echo "registry does not show $WANT yet (try $i of 60), waiting 10s"; sleep 10
          done
          if [ -z "$seen" ]; then echo "refuse: nenrin-verify@$WANT did not appear in the registry within 10 minutes (the publish step itself succeeded; check npmjs.com before publishing again)"; exit 1; fi
          echo "published:"; npm view "nenrin-verify@$WANT" version dist.integrity dist.tarball
          echo "attestation:"; npm view "nenrin-verify@$WANT" dist.attestations
          T=$(mktemp -d); cd "$T"; npm init -y >/dev/null 2>&1
          ok=""
          for i in $(seq 1 30); do
            echo "provenance check (install, then npm audit signatures), try $i of 30:"
            if npm install --ignore-scripts --prefer-online "nenrin-verify@$WANT" && npm audit signatures; then ok=1; break; fi
            echo "the registry does not serve the package or its attestation yet, waiting 10s"; sleep 10
          done
          if [ -z "$ok" ]; then echo "refuse: the attestation for nenrin-verify@$WANT was not served within 5 minutes"; exit 1; fi
