name: MCP registry drift

# C16 detector. Fails red when any server.json version on main disagrees with what the
# live MCP registry advertises as latest. Always queries with &version=latest.
# Install: cp ops/registry-drift.yml .github/workflows/registry-drift.yml
# Run on demand: Actions -> MCP registry drift -> Run workflow.

on:
  schedule:
    - cron: "17 3 * * *"   # daily 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: registry-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: "22"
      - name: check registry vs main
        run: node ops/registry_drift_check.mjs
