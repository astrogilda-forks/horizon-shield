# Hold an independent copy of the NENRIN ledger (nenrin-mirror-v0), with no code fetched at run time.
#
# This is the vendored variant of nenrin-mirror.yml, for organisations that will not run code fetched from
# someone else's repository on a schedule. mirror.py is committed once into your own repository at
# tools/nenrin-mirror/mirror.py, after you have read it (REVIEW.md lists every network call and every write).
# Each run refuses to start unless that file's sha256 is the one written below, so nothing changes what runs
# here until you commit a new copy and a new pin yourself. Nothing is downloaded except ledger data.
#
# Put it in a repository created only for the mirror. Its GITHUB_TOKEN then can write to that repository and
# nothing else, and the only thing it writes is one branch holding the copy.
#
# What a copy establishes: that these bytes, with these digests, were obtainable from the ledger at mirrored_at,
# and that anyone holding the branch can recompute every digest offline (python3 mirror.py verify --dir mirror).
# What it does not establish: that any claim in the ledger is true, or that an anchor is valid (check the .ots
# files against Bitcoin headers with any OpenTimestamps client).
name: NENRIN mirror (vendored)

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nenrin-mirror-vendored
  cancel-in-progress: false

env:
  MIRROR_PY: tools/nenrin-mirror/mirror.py
  MIRROR_PY_SHA256: 7de4bd1d8fca8efef1e29a91ae400ff11207f8825532984760fe86afd70173ba
  BRANCH: nenrin-mirror

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the mirror branch (created on the first run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          echo "GIT_AUTH=http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" >> "$GITHUB_ENV"
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" "$BRANCH" >/dev/null 2>&1; then
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" clone --quiet --branch "$BRANCH" "$url" work
          else
            mkdir work && cd work && git init --quiet -b "$BRANCH" && git remote add origin "$url"
          fi
      - name: Check out this repository (for the vendored mirror.py only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: self
          persist-credentials: false
      - name: Check the vendored mirror.py against the pin
        run: |
          set -euo pipefail
          cp "self/$MIRROR_PY" mirror.py
          got="$(sha256sum mirror.py | cut -d' ' -f1)"
          [ "$got" = "$MIRROR_PY_SHA256" ] || { echo "::error::$MIRROR_PY sha256 is $got, not the pinned $MIRROR_PY_SHA256"; exit 1; }
          echo "mirror.py $got (vendored, nothing fetched)"
      - name: Pull (resumes from what the branch already holds) and verify offline
        run: |
          set -uo pipefail
          python3 mirror.py pull --dir work/mirror --quiet; pull=$?
          set -e
          python3 mirror.py verify --dir work/mirror | tee verify.txt
          [ "$pull" = 0 ] || echo "::warning::pull reported problems; they are listed in manifest.json under problems and the copy is kept"
          { echo "### NENRIN mirror"; echo; echo '```'; tail -n 3 verify.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the copy
        run: |
          set -euo pipefail
          cd work
          git add mirror
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          c="$(python3 -c 'import json;m=json.load(open("mirror/manifest.json"));print(m["content_sha256"][:12], m["range"])')"
          git -c user.name="nenrin-mirror" -c user.email="nenrin-mirror@users.noreply.github.com" commit --quiet -m "nenrin mirror: content_sha256 ${c}"
          git -c "$GIT_AUTH" push --quiet origin "$BRANCH"
